[package]
name = "hireclaw-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hireclaw — contrat NEAR de l'agent-patron : bornes de paie, split, refus publics et invariants"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["legacy"] }
borsh = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
schemars = { version = "0.8", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "legacy", "abi"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true